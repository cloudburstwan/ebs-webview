name: ebs
services:
  webview:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - S3_ENDPOINT=
        - S3_ACCESS_KEY=
        - S3_SECRET_KEY=
    restart: unless-stopped
    volumes:
      - ./certs/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - path: ./.env
        required: true